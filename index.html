<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Perpustakaan Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-900 text-slate-800 font-sans min-h-screen flex flex-col relative overflow-x-hidden"
  >
    <div
      class="fixed inset-0 -z-10 bg-[url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000')] bg-cover bg-center filter blur-md scale-105 opacity-40"
    ></div>

    <header
      class="sticky top-0 z-50 bg-black/60 backdrop-blur-md border-b border-white/10 text-white py-4 px-6 shadow-lg"
    >
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
          <span>Perpustakaan Digital</span>
        </h1>
        <nav class="text-sm text-gray-500">
          <span>Aplikasi Kelola Buku</span>
        </nav>
      </div>
    </header>

    <main
      class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 my-6 bg-white/70 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/40"
    >
      <section
        class="mb-10 bg-white/80 rounded-xl p-6 shadow-sm border border-gray-100"
      >
        <h2
          class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200"
        >
          Tambah Buku Baru
        </h2>
        <div
          id="notif"
          class="hidden mb-4 p-3 rounded-lg bg-green-500 text-white font-semibold"
        >
          Buku berhasil ditambah!
        </div>

        <form id="form-buku" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label
              for="judul"
              class="block text-sm font-semibold mb-1 text-gray-700"
              >Judul Buku</label
            >
            <input
              type="text"
              id="judul"
              placeholder="Contoh: Laskar Pelangi"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90"
            />
          </div>

          <div>
            <label
              for="penulis"
              class="block text-sm font-semibold mb-1 text-gray-700"
              >Penulis</label
            >
            <input
              type="text"
              id="penulis"
              placeholder="Contoh: Andrea Hirata"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90"
            />
          </div>

          <div>
            <label
              for="tahun"
              class="block text-sm font-semibold mb-1 text-gray-700"
              >Tahun Terbit</label
            >
            <input
              type="number"
              id="tahun"
              placeholder="Contoh: 2005"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/90"
            />
          </div>

          <div class="md:col-span-3 flex justify-end mt-2">
            <button
              type="submit"
              id="btn-simpan"
              class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200 shadow-md flex items-center gap-2"
            >
              Simpan Buku
            </button>
          </div>
        </form>
      </section>

      <section
        class="bg-white/80 rounded-xl p-6 shadow-sm border border-gray-100"
      >
        <h2
          class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200"
        >
          Daftar Koleksi Buku
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-gray-800 text-white text-sm uppercase tracking-wider text-center"
              >
                <th class="p-3 rounded-tl-lg">Judul</th>
                <th class="p-3">Penulis</th>
                <th class="p-3">Tahun</th>
                <th class="p-3">Status</th>
                <th class="p-3 text-center rounded-tr-lg">Aksi</th>
              </tr>
            </thead>
            <tbody
              id="tabel-buku"
              class="divide-y divide-gray-200 text-sm"
            ></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer
      class="bg-black/70 backdrop-blur-md text-gray-400 py-4 text-center text-sm border-t border-white/10 mt-auto"
    >
      <p>
        &copy; 2026 Perpustakaan Digital | Handika Saputra
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
